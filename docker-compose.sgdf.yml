# ══════════════════════════════════════════════════════════════════════════════
#  docker-compose.sgdf.yml — Servicio Next.js SGDF
#  ⚠️  Este archivo va en tu Ubuntu Server, junto al docker-compose.yml de Supabase
#  Se agrega como un servicio adicional al stack existente.
#  Comando para correrlo: docker compose -f docker-compose.yml -f docker-compose.sgdf.yml up -d
# ══════════════════════════════════════════════════════════════════════════════

services:
  sgdf-web:
    image: sgdf-web:latest          # Nombre de la imagen que buildearás en el servidor
    container_name: sgdf-web
    restart: unless-stopped          # Se levanta automáticamente tras reinicios
    ports:
      - "3000:3000"                  # Puerto accesible en la red local: http://IP_SERVIDOR:3000
    environment:
      # ── Variables de entorno de PRODUCCIÓN ──────────────────────────────
      # Apuntan al Supabase que corre LOCALMENTE en el mismo servidor (ultra-rápido)
      - NEXT_PUBLIC_SUPABASE_URL=http://localhost:8000
      - NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SERVICE_ROLE_KEY}

      # ── Variables de seguridad ───────────────────────────────────────────
      - CHATBOT_API_KEY=${CHATBOT_API_KEY}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/flujo-principal
      - ALLOWED_REDIRECT_HOSTS=localhost:3000
      - ALLOWED_CORS_ORIGINS=

      # ── Node ─────────────────────────────────────────────────────────────
      - NODE_ENV=production
    networks:
      - supabase_default             # Debe estar en la misma red que Supabase
    depends_on:
      - supabase-kong                # Espera a que Supabase esté listo

networks:
  supabase_default:
    external: true                   # Usa la red ya creada por el docker-compose de Supabase
